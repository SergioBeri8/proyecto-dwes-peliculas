<div class="login-wrapper">
  <div class="login-card">
    <h2>App peliculas</h2>
    <p>Inicia sesión para gestionar tus películas</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      
      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input 
          id="email"
          type="email" 
          formControlName="email" 
          placeholder="ejemplo@correo.com"
        >
        <small class="error-text" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Email no válido
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password"
          type="password" 
          formControlName="password" 
          placeholder="Mínimo 6 caracteres"
        >
        <small class="error-text" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Mínimo 6 caracteres
        </small>
      </div>

      <button type="submit" [disabled]="loginForm.invalid" class="btn-login">
        Entrar al Sistema
      </button>
    </form>

    <div class="footer-links">
      <p>¿No tienes cuenta? <a routerLink="/auth/register">Regístrate ahora</a></p>
    </div>
  </div>
</div>
